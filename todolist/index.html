<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --glass-bg: rgba(255,255,255,0.13);
    --glass-bg-strong: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.28);
    --glass-border-subtle: rgba(255,255,255,0.14);
    --glass-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    --glass-shadow-lg: 0 20px 60px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.10);
    --text-primary: rgba(255,255,255,0.95);
    --text-secondary: rgba(255,255,255,0.65);
    --text-tertiary: rgba(255,255,255,0.38);
    --accent-blue: #4db8ff;
    --accent-purple: #b27fff;
    --accent-pink: #ff7eb3;
    --accent-teal: #5ee7d0;
    --priority-urgent: #ff5f5f;
    --priority-high: #ff9a3c;
    --priority-medium: #4db8ff;
    --priority-low: rgba(255,255,255,0.35);
    --cat-work: #4db8ff;
    --cat-personal: #b27fff;
    --cat-health: #5ee7d0;
    --cat-finance: #ffd166;
    --cat-learning: #ff9a3c;
    --cat-other: #ff7eb3;
    --blur: blur(24px) saturate(180%);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-xl: 32px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: #050914;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text-primary);
  }

  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .aurora::before {
    content: '';
    position: absolute;
    width: 900px; height: 900px;
    background: radial-gradient(ellipse, rgba(99,102,241,0.45) 0%, transparent 70%);
    top: -200px; left: -200px;
    animation: drift1 18s ease-in-out infinite alternate;
    border-radius: 50%;
  }

  .aurora::after {
    content: '';
    position: absolute;
    width: 800px; height: 800px;
    background: radial-gradient(ellipse, rgba(236,72,153,0.28) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    animation: drift2 22s ease-in-out infinite alternate;
    border-radius: 50%;
  }

  .aurora-mid {
    position: absolute;
    width: 700px; height: 700px;
    background: radial-gradient(ellipse, rgba(6,182,212,0.22) 0%, transparent 70%);
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    animation: drift3 26s ease-in-out infinite alternate;
    border-radius: 50%;
  }

  .aurora-extra {
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(ellipse, rgba(168,85,247,0.2) 0%, transparent 70%);
    top: 20%; right: 15%;
    animation: drift4 20s ease-in-out infinite alternate;
    border-radius: 50%;
  }

  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(80px,60px) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,-80px) scale(1.1); } }
  @keyframes drift3 { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-45%,-55%) scale(1.2); } }
  @keyframes drift4 { from { transform: translate(0,0); } to { transform: translate(-40px,50px); } }

  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.03;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 150px;
  }

  .app {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px 100px;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    padding: 56px 0 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .header-left .greeting {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header-left .date-display {
    font-family: 'Instrument Serif', serif;
    font-size: 34px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.1;
  }

  .header-left .date-display .day-name {
    font-style: italic;
    color: var(--accent-blue);
  }

  .progress-ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .progress-ring-wrap svg {
    filter: drop-shadow(0 0 8px rgba(77,184,255,0.4));
  }

  .progress-ring-wrap .ring-label {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 5; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 5;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 12px;
    text-align: center;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .stat-card:hover {
    background: var(--glass-bg-strong);
    transform: translateY(-2px);
  }

  .stat-card .stat-num {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card .stat-label {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* DATE STRIP */
  .date-nav {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-subtle);
    border-radius: var(--radius-lg);
    padding: 12px 8px;
    margin-bottom: 20px;
    box-shadow: var(--glass-shadow);
    overflow: hidden;
  }

  .date-nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 10px;
  }

  .month-year {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .nav-arrows {
    display: flex;
    gap: 4px;
  }

  .nav-arrow-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border-subtle);
    border-radius: 8px;
    color: var(--text-secondary);
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .nav-arrow-btn:hover {
    background: rgba(255,255,255,0.16);
    color: var(--text-primary);
  }

  .days-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 4px;
    scrollbar-width: none;
  }

  .days-strip::-webkit-scrollbar { display: none; }

  .day-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    border-radius: 12px;
    cursor: pointer;
    min-width: 48px;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    border: 1px solid transparent;
    flex-shrink: 0;
    position: relative;
  }

  .day-pill:hover {
    background: rgba(255,255,255,0.1);
  }

  .day-pill.active {
    background: linear-gradient(135deg, rgba(77,184,255,0.3), rgba(178,127,255,0.3));
    border-color: rgba(77,184,255,0.4);
    box-shadow: 0 4px 16px rgba(77,184,255,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
    transform: scale(1.05);
  }

  .day-pill.today::after {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--accent-blue);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--accent-blue);
  }

  .day-pill .day-name-short {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
  }

  .day-pill.active .day-name-short { color: rgba(77,184,255,0.9); }

  .day-pill .day-num {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-secondary);
    line-height: 1;
  }

  .day-pill.active .day-num { color: var(--text-primary); }

  .day-pill .task-dot {
    width: 14px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }

  .day-pill .task-dot-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-chip {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-subtle);
    color: var(--text-secondary);
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .filter-chip:hover { background: var(--glass-bg-strong); color: var(--text-primary); }

  .filter-chip.active {
    background: linear-gradient(135deg, rgba(77,184,255,0.25), rgba(178,127,255,0.25));
    border-color: rgba(77,184,255,0.5);
    color: var(--text-primary);
    box-shadow: 0 2px 12px rgba(77,184,255,0.15);
  }

  /* TASK LIST */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .tasks-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .task-card {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: var(--glass-shadow);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    cursor: default;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
  }

  .task-card[data-priority="urgent"]::before { background: var(--priority-urgent); box-shadow: 0 0 8px var(--priority-urgent); }
  .task-card[data-priority="high"]::before { background: var(--priority-high); box-shadow: 0 0 8px var(--priority-high); }
  .task-card[data-priority="medium"]::before { background: var(--priority-medium); box-shadow: 0 0 8px var(--priority-medium); }
  .task-card[data-priority="low"]::before { background: var(--priority-low); }

  .task-card:hover {
    background: var(--glass-bg-strong);
    transform: translateY(-2px);
    box-shadow: var(--glass-shadow-lg);
  }

  .task-card.completed {
    opacity: 0.5;
  }

  .task-card.completed .task-title {
    text-decoration: line-through;
    color: var(--text-tertiary);
  }

  .checkbox-wrap {
    flex-shrink: 0;
    margin-top: 1px;
  }

  .checkbox {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    background: transparent;
    flex-shrink: 0;
  }

  .checkbox:hover {
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
    transform: scale(1.1);
  }

  .checkbox.checked {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border-color: transparent;
    box-shadow: 0 0 12px rgba(77,184,255,0.5);
    transform: scale(1.05);
  }

  .checkbox.checked::after {
    content: '';
    width: 10px; height: 7px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  .task-content { flex: 1; min-width: 0; }

  .task-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 5px;
    line-height: 1.3;
    transition: color 0.2s, text-decoration 0.2s;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .task-cat-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
    letter-spacing: 0.03em;
  }

  .task-time {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .task-time svg { opacity: 0.6; }

  .task-note {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 4px;
    line-height: 1.4;
  }

  .task-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .task-card:hover .task-actions { opacity: 1; }

  .task-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border-subtle);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.2s ease;
  }

  .task-btn:hover {
    background: rgba(255,255,255,0.16);
    color: var(--text-primary);
  }

  .task-btn.del:hover {
    background: rgba(255,95,95,0.2);
    border-color: rgba(255,95,95,0.4);
    color: var(--priority-urgent);
  }

  .priority-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 7px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow);
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    filter: grayscale(0.3);
  }

  .empty-state h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .empty-state p {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(77,184,255,0.9), rgba(178,127,255,0.9));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(77,184,255,0.35), 0 2px 8px rgba(0,0,0,0.2);
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    letter-spacing: 0.01em;
  }

  .fab:hover {
    transform: translateX(-50%) translateY(-3px) scale(1.04);
    box-shadow: 0 14px 40px rgba(77,184,255,0.45), 0 4px 12px rgba(0,0,0,0.25);
  }

  .fab:active { transform: translateX(-50%) scale(0.97); }

  .fab-icon {
    width: 22px; height: 22px;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    line-height: 1;
  }

  /* MODAL */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,9,20,0.6);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    width: 100%;
    max-width: 520px;
    background: rgba(18,22,40,0.92);
    backdrop-filter: blur(40px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.16);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    padding: 8px 20px 48px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.4);
  }

  .overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 40px; height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    margin: 12px auto 20px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 20px;
    padding-left: 4px;
  }

  .modal-subtitle {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .modal-input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    resize: none;
  }

  .modal-input::placeholder { color: var(--text-tertiary); }
  .modal-input:focus {
    background: rgba(255,255,255,0.11);
    border-color: rgba(77,184,255,0.5);
    box-shadow: 0 0 0 3px rgba(77,184,255,0.12);
  }

  .option-grid {
    display: grid;
    gap: 8px;
  }

  .option-grid-2 { grid-template-columns: 1fr 1fr; }
  .option-grid-3 { grid-template-columns: repeat(3, 1fr); }

  .option-btn {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .option-btn:hover {
    background: rgba(255,255,255,0.12);
    color: var(--text-primary);
  }

  .option-btn.selected {
    background: linear-gradient(135deg, rgba(77,184,255,0.22), rgba(178,127,255,0.22));
    border-color: rgba(77,184,255,0.5);
    color: var(--text-primary);
    box-shadow: 0 0 12px rgba(77,184,255,0.15);
  }

  .priority-btn[data-p="urgent"].selected { border-color: var(--priority-urgent); background: rgba(255,95,95,0.15); box-shadow: 0 0 12px rgba(255,95,95,0.15); }
  .priority-btn[data-p="high"].selected { border-color: var(--priority-high); background: rgba(255,154,60,0.15); box-shadow: 0 0 12px rgba(255,154,60,0.15); }
  .priority-btn[data-p="medium"].selected { border-color: var(--priority-medium); background: rgba(77,184,255,0.15); }
  .priority-btn[data-p="low"].selected { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); }

  .priority-btn .p-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(77,184,255,0.85), rgba(178,127,255,0.85));
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 6px 24px rgba(77,184,255,0.25);
    letter-spacing: 0.01em;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(77,184,255,0.35);
  }

  .submit-btn:active { transform: scale(0.98); }

  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* CATEGORY COLORS */
  .cat-work { color: var(--cat-work); }
  .cat-personal { color: var(--cat-personal); }
  .cat-health { color: var(--cat-health); }
  .cat-finance { color: var(--cat-finance); }
  .cat-learning { color: var(--cat-learning); }
  .cat-other { color: var(--cat-other); }

  .badge-work { background: rgba(77,184,255,0.18); color: var(--cat-work); }
  .badge-personal { background: rgba(178,127,255,0.18); color: var(--cat-personal); }
  .badge-health { background: rgba(94,231,208,0.18); color: var(--cat-health); }
  .badge-finance { background: rgba(255,209,102,0.18); color: var(--cat-finance); }
  .badge-learning { background: rgba(255,154,60,0.18); color: var(--cat-learning); }
  .badge-other { background: rgba(255,126,179,0.18); color: var(--cat-other); }

  /* SCROLL FADE */
  .tasks-fade-wrap {
    position: relative;
  }

  /* TOAST */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: rgba(30,34,60,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: var(--glass-shadow);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* DELETE animation */
  @keyframes taskDelete {
    to { opacity: 0; transform: scale(0.9) translateX(20px); max-height: 0; padding: 0; margin: 0; }
  }

  .task-card.deleting {
    animation: taskDelete 0.3s ease forwards;
  }

  .inline-date-label {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 4px;
    padding-left: 4px;
  }

  /* SELECTED DATE PILL in modal */
  .selected-date-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(77,184,255,0.12);
    border: 1px solid rgba(77,184,255,0.3);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-blue);
    margin-bottom: 4px;
  }

  .selected-date-row svg { opacity: 0.8; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ═══════════════════════════════════════════════
     RESPONSIVE SYSTEM
     xs   : < 360px  (small phones)
     sm   : 360–599px (phones — base design)
     md   : 600–899px (large phones / tablets)
     lg   : 900–1199px (tablets / small desktops)
     xl   : ≥ 1200px (desktops)
  ═══════════════════════════════════════════════ */

  /* ── Always: safe-area + touch UX ──────────── */
  .fab {
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .modal {
    padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
  }

  /* Touch: always show task actions (no hover needed) */
  @media (hover: none) {
    .task-actions { opacity: 1; }
    .task-btn { width: 34px; height: 34px; }
  }

  /* ── XS — small phones (< 360px) ───────────── */
  @media (max-width: 359px) {
    .app { padding: 0 10px 88px; }

    .header { padding: 28px 0 14px; }
    .header-left .date-display { font-size: 24px; }
    .header-left .greeting { font-size: 11px; }

    .progress-ring-wrap svg { width: 52px; height: 52px; }

    .stats-row { gap: 6px; }
    .stat-card { padding: 10px 8px; }
    .stat-card .stat-num { font-size: 20px; }
    .stat-card .stat-label { font-size: 10px; }

    .day-pill { min-width: 40px; padding: 6px 7px; }
    .day-pill .day-num { font-size: 14px; }
    .day-pill .day-name-short { font-size: 9px; }

    .filter-chip { padding: 6px 12px; font-size: 12px; }

    .task-title { font-size: 14px; }
    .option-grid-3 { grid-template-columns: 1fr 1fr; }
    .option-btn { font-size: 12px; padding: 9px 8px; }

    .fab { padding: 12px 22px; font-size: 14px; border-radius: 18px; }
    .fab-icon { width: 18px; height: 18px; font-size: 16px; }
  }

  /* ── SM — phones (360–599px, base design) ──── */
  @media (max-width: 599px) {
    .header { padding: 36px 0 18px; }

    /* Keep task actions visible on mobile */
    .task-actions {
      opacity: 1;
      flex-direction: column;
      gap: 3px;
    }

    /* Slightly larger touch targets */
    .checkbox { width: 24px; height: 24px; }
    .nav-arrow-btn { width: 34px; height: 34px; }
  }

  /* ── MD — large phones & tablets (600–899px) ── */
  @media (min-width: 600px) {
    .app {
      max-width: 640px;
      padding: 0 28px 110px;
    }

    .header { padding: 52px 0 28px; }
    .header-left .date-display { font-size: 38px; }

    .stats-row { gap: 14px; }
    .stat-card { padding: 18px 14px; border-radius: var(--radius-lg); }
    .stat-card .stat-num { font-size: 30px; }
    .stat-card .stat-label { font-size: 12px; }

    .date-nav { padding: 14px 12px; border-radius: var(--radius-xl); }
    .day-pill { min-width: 54px; padding: 10px 12px; }
    .day-pill .day-num { font-size: 20px; }

    .filter-chip { padding: 8px 18px; font-size: 13.5px; }

    .task-card { padding: 16px 20px; gap: 14px; }
    .task-title { font-size: 16px; }
    .task-actions { opacity: 1; }
    .task-btn { width: 32px; height: 32px; }

    .modal { max-width: 600px; }
    .modal-input { font-size: 16px; padding: 14px 16px; }
    .submit-btn { font-size: 17px; padding: 18px; }

    .fab { padding: 16px 32px; font-size: 16px; }
    .fab-icon { width: 24px; height: 24px; font-size: 20px; }

    .progress-ring-wrap svg { width: 72px; height: 72px; }
  }

  /* ── LG — tablets & small desktops (900–1199px) */
  @media (min-width: 900px) {
    body { overflow-y: auto; }

    .app {
      max-width: 900px;
      padding: 0 40px 80px;
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto auto auto 1fr;
      column-gap: 28px;
      align-items: start;
    }

    .header {
      grid-column: 1 / -1;
      padding: 56px 0 24px;
    }

    .stats-row {
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 24px;
    }

    /* Date nav sticky in right column */
    .date-nav {
      grid-column: 2;
      grid-row: 3 / 5;
      position: sticky;
      top: 24px;
    }

    /* Main content (filters + tasks) in left column */
    .main-col {
      grid-column: 1;
      grid-row: 3 / 5;
    }

    .task-actions { opacity: 1; }
    .task-btn { width: 32px; height: 32px; }

    /* Modal: centered dialog */
    .overlay { align-items: center; justify-content: center; }
    .modal {
      border-radius: var(--radius-xl);
      border-bottom: 1px solid rgba(255,255,255,0.16);
      max-width: 500px;
      width: 90%;
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(24px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0;
      padding: 8px 28px 40px;
    }
    .overlay.open .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .modal-handle { display: none; }

    .fab {
      right: 40px;
      left: auto;
      transform: none;
      bottom: 40px;
      border-radius: 16px;
    }
    .fab:hover { transform: translateY(-3px) scale(1.04); }
    .fab:active { transform: scale(0.97); }
  }

  /* ── XL — large desktops (≥ 1200px) ────────── */
  @media (min-width: 1200px) {
    .app {
      max-width: 1080px;
      grid-template-columns: 1fr 360px;
      column-gap: 36px;
      padding: 0 48px 80px;
    }

    .header-left .date-display { font-size: 44px; }

    .stats-row {
      grid-template-columns: repeat(3, 1fr);
    }
    .stat-card .stat-num { font-size: 34px; }

    .task-card { padding: 18px 22px; }
    .task-title { font-size: 16px; }

    .fab { right: 48px; bottom: 48px; }
  }
</style>
</head>
<body>
<div class="aurora">
  <div class="aurora-mid"></div>
  <div class="aurora-extra"></div>
</div>
<div class="noise"></div>

<div class="app" id="app">
  <header class="header">
    <div class="header-left">
      <div class="greeting" id="greeting">Good morning</div>
      <div class="date-display" id="mainDate">
        <span class="day-name" id="mainDayName">Monday</span><br>
        <span id="mainDateFull">May 11, 2026</span>
      </div>
    </div>
    <div class="progress-ring-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4db8ff"/>
            <stop offset="100%" stop-color="#b27fff"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="32" cy="32" r="27"/>
        <circle class="ring-fill" id="progressRing" cx="32" cy="32" r="27"
          stroke-dasharray="169.65" stroke-dashoffset="169.65"/>
        <text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700"
          fill="white" font-family="Outfit, sans-serif" id="progressText">0%</text>
      </svg>
      <div class="ring-label">Done</div>
    </div>
  </header>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num" id="statDone">0</div><div class="stat-label">Done</div></div>
    <div class="stat-card"><div class="stat-num" id="statLeft">0</div><div class="stat-label">Left</div></div>
  </div>

  <div class="date-nav">
    <div class="date-nav-header">
      <span class="month-year" id="stripMonthYear">May 2026</span>
      <div class="nav-arrows">
        <button class="nav-arrow-btn" onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
        <button class="nav-arrow-btn" onclick="goToday()" aria-label="Today" style="font-size:11px;font-weight:700;font-family:'Outfit',sans-serif;width:auto;padding:0 8px;letter-spacing:.02em;">Today</button>
        <button class="nav-arrow-btn" onclick="shiftWeek(1)" aria-label="Next week">›</button>
      </div>
    </div>
    <div class="days-strip" id="daysStrip"></div>
  </div>

  <div class="main-col">
    <div class="filters" id="filters">
      <div class="filter-chip active" data-filter="all" onclick="setFilter(this)">All</div>
      <div class="filter-chip" data-filter="active" onclick="setFilter(this)">Active</div>
      <div class="filter-chip" data-filter="completed" onclick="setFilter(this)">Done</div>
      <div class="filter-chip" data-filter="urgent" onclick="setFilter(this)">🔴 Urgent</div>
      <div class="filter-chip" data-filter="high" onclick="setFilter(this)">🟠 High</div>
      <div class="filter-chip" data-filter="work" onclick="setFilter(this)">Work</div>
      <div class="filter-chip" data-filter="personal" onclick="setFilter(this)">Personal</div>
      <div class="filter-chip" data-filter="health" onclick="setFilter(this)">Health</div>
    </div>
    <div class="section-label" id="taskSectionLabel">TASKS FOR TODAY</div>
    <div class="tasks-fade-wrap">
      <div class="tasks-list" id="tasksList"></div>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()">
  <div class="fab-icon">+</div>
  New Task
</button>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">New Task</div>

    <div class="selected-date-row" id="modalDateRow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="modalDateLabel">Today</span>
    </div>

    <div class="modal-subtitle">Task Title</div>
    <input class="modal-input" id="taskTitle" placeholder="What needs to be done?" maxlength="120">

    <div class="modal-subtitle">Notes (optional)</div>
    <textarea class="modal-input" id="taskNote" rows="2" placeholder="Add details or notes…"></textarea>

    <div class="modal-subtitle">Priority</div>
    <div class="option-grid option-grid-2">
      <button class="option-btn priority-btn" data-p="urgent" onclick="selPriority('urgent')">
        <span class="p-dot" style="background:var(--priority-urgent);box-shadow:0 0 6px var(--priority-urgent)"></span> Urgent
      </button>
      <button class="option-btn priority-btn" data-p="high" onclick="selPriority('high')">
        <span class="p-dot" style="background:var(--priority-high);box-shadow:0 0 6px var(--priority-high)"></span> High
      </button>
      <button class="option-btn priority-btn selected" data-p="medium" onclick="selPriority('medium')">
        <span class="p-dot" style="background:var(--priority-medium);box-shadow:0 0 6px var(--priority-medium)"></span> Medium
      </button>
      <button class="option-btn priority-btn" data-p="low" onclick="selPriority('low')">
        <span class="p-dot" style="background:rgba(255,255,255,0.4)"></span> Low
      </button>
    </div>

    <div class="modal-subtitle">Category</div>
    <div class="option-grid option-grid-3">
      <button class="option-btn cat-btn selected" data-c="work" onclick="selCat('work')">💼 Work</button>
      <button class="option-btn cat-btn" data-c="personal" onclick="selCat('personal')">🏠 Personal</button>
      <button class="option-btn cat-btn" data-c="health" onclick="selCat('health')">💪 Health</button>
      <button class="option-btn cat-btn" data-c="finance" onclick="selCat('finance')">💰 Finance</button>
      <button class="option-btn cat-btn" data-c="learning" onclick="selCat('learning')">📚 Learning</button>
      <button class="option-btn cat-btn" data-c="other" onclick="selCat('other')">⚡ Other</button>
    </div>

    <div class="modal-subtitle">Time (optional)</div>
    <div class="time-row">
      <input class="modal-input" type="time" id="taskStart" placeholder="Start">
      <input class="modal-input" type="time" id="taskEnd" placeholder="End">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitTask()">Add Task</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CAT_ICONS = { work:'💼', personal:'🏠', health:'💪', finance:'💰', learning:'📚', other:'⚡' };
const CAT_LABELS = { work:'Work', personal:'Personal', health:'Health', finance:'Finance', learning:'Learning', other:'Other' };
const PRI_LABELS = { urgent:'Urgent', high:'High', medium:'Medium', low:'Low' };

let tasks = JSON.parse(localStorage.getItem('glasstasks_v2') || '{}');
let selectedDate = todayKey();
let weekOffset = 0;
let currentFilter = 'all';
let editId = null;
let selPri = 'medium';
let selCategory = 'work';

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateFromKey(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}

function keyFromDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function save() { localStorage.setItem('glasstasks_v2', JSON.stringify(tasks)); }

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function formatDateLabel(k) {
  const today = todayKey();
  const tomorrow = (() => { const d = new Date(); d.setDate(d.getDate()+1); return keyFromDate(d); })();
  const yesterday = (() => { const d = new Date(); d.setDate(d.getDate()-1); return keyFromDate(d); })();
  const d = dateFromKey(k);
  if (k === today) return 'Today';
  if (k === tomorrow) return 'Tomorrow';
  if (k === yesterday) return 'Yesterday';
  return `${DAYS[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
}

function formatDisplayDate(k) {
  const d = dateFromKey(k);
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function renderHeader() {
  const d = dateFromKey(selectedDate);
  document.getElementById('greeting').textContent = getGreeting();
  document.getElementById('mainDayName').textContent = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  document.getElementById('mainDateFull').textContent = `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  const dayTasks = tasks[selectedDate] || [];
  const total = dayTasks.length;
  const done = dayTasks.filter(t => t.done).length;
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  const circ = 2 * Math.PI * 27;
  const offset = circ - (pct/100)*circ;
  document.getElementById('progressRing').style.strokeDashoffset = offset;
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statLeft').textContent = total - done;
}

function renderStrip() {
  const strip = document.getElementById('daysStrip');
  const today = new Date();
  const startOffset = weekOffset * 7;
  const days = [];
  for (let i = -3 + startOffset; i <= 10 + startOffset; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }
  const first = days[0];
  document.getElementById('stripMonthYear').textContent = `${MONTHS[first.getMonth()]} ${first.getFullYear()}`;

  strip.innerHTML = '';
  days.forEach(d => {
    const k = keyFromDate(d);
    const isActive = k === selectedDate;
    const isToday = k === todayKey();
    const dayTasks = tasks[k] || [];
    const total = dayTasks.length;
    const done = dayTasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done/total)*100);

    const pill = document.createElement('div');
    pill.className = 'day-pill' + (isActive ? ' active' : '') + (isToday ? ' today' : '');
    pill.innerHTML = `
      <span class="day-name-short">${DAYS[d.getDay()]}</span>
      <span class="day-num">${d.getDate()}</span>
      <div class="task-dot"><div class="task-dot-fill" style="width:${pct}%"></div></div>
    `;
    pill.onclick = () => { selectedDate = k; weekOffset = Math.floor((d - today) / 864e5 / 7) * 1; renderAll(); };
    strip.appendChild(pill);
  });

  // scroll selected into view
  setTimeout(() => {
    const active = strip.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function getFilteredTasks() {
  const dayTasks = [...(tasks[selectedDate] || [])];
  return dayTasks.filter(t => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'active') return !t.done;
    if (currentFilter === 'completed') return t.done;
    if (currentFilter === 'urgent') return t.priority === 'urgent';
    if (currentFilter === 'high') return t.priority === 'high';
    if (['work','personal','health','finance','learning','other'].includes(currentFilter)) return t.category === currentFilter;
    return true;
  }).sort((a,b) => {
    const po = { urgent:0, high:1, medium:2, low:3 };
    if (!a.done && b.done) return -1;
    if (a.done && !b.done) return 1;
    return (po[a.priority]||2) - (po[b.priority]||2);
  });
}

function renderTasks() {
  const list = document.getElementById('tasksList');
  const filtered = getFilteredTasks();
  const label = document.getElementById('taskSectionLabel');
  const dayLabel = formatDateLabel(selectedDate).toUpperCase();
  label.textContent = `TASKS FOR ${dayLabel}`;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <span class="empty-icon">✨</span>
      <h3>No tasks here</h3>
      <p>${currentFilter === 'all' ? `Tap "+ New Task" to plan your ${dayLabel.toLowerCase()}` : 'Try a different filter'}</p>
    </div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach((task, idx) => {
    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' completed' : '');
    card.dataset.priority = task.priority || 'medium';
    card.dataset.id = task.id;
    card.style.animationDelay = `${idx * 0.05}s`;

    const timeTxt = task.startTime
      ? `<span class="task-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${task.startTime}${task.endTime ? ' – '+task.endTime : ''}</span>`
      : '';

    card.innerHTML = `
      <div class="checkbox-wrap">
        <div class="checkbox ${task.done ? 'checked' : ''}" onclick="toggleTask('${task.id}')"></div>
      </div>
      <div class="task-content">
        <div class="task-title">${escHtml(task.title)}</div>
        <div class="task-meta">
          <span class="task-cat-badge badge-${task.category || 'other'}">${CAT_ICONS[task.category||'other']} ${CAT_LABELS[task.category||'other']}</span>
          ${timeTxt}
        </div>
        ${task.note ? `<div class="task-note">${escHtml(task.note)}</div>` : ''}
      </div>
      <div class="task-actions">
        <button class="task-btn" onclick="editTask('${task.id}')" title="Edit">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="task-btn del" onclick="deleteTask('${task.id}')" title="Delete">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    `;
    list.appendChild(card);
  });
}

function renderAll() {
  renderHeader();
  renderStrip();
  renderTasks();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleTask(id) {
  const arr = tasks[selectedDate] || [];
  const t = arr.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    save();
    renderAll();
    showToast(t.done ? '✅ Task completed!' : '↩️ Marked as active');
  }
}

function deleteTask(id) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) {
    card.classList.add('deleting');
    setTimeout(() => {
      tasks[selectedDate] = (tasks[selectedDate] || []).filter(x => x.id !== id);
      save();
      renderAll();
    }, 280);
  }
}

function editTask(id) {
  const arr = tasks[selectedDate] || [];
  const t = arr.find(x => x.id === id);
  if (!t) return;
  editId = id;
  document.getElementById('taskTitle').value = t.title;
  document.getElementById('taskNote').value = t.note || '';
  document.getElementById('taskStart').value = t.startTime || '';
  document.getElementById('taskEnd').value = t.endTime || '';
  selPriority(t.priority || 'medium');
  selCat(t.category || 'work');
  document.getElementById('modalTitle').textContent = 'Edit Task';
  document.getElementById('submitBtn').textContent = 'Save Changes';
  updateModalDate();
  openModal();
}

function setFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = el.dataset.filter;
  renderTasks();
}

function shiftWeek(dir) {
  weekOffset += dir;
  renderStrip();
}

function goToday() {
  weekOffset = 0;
  selectedDate = todayKey();
  renderAll();
}

function selPriority(p) {
  selPri = p;
  document.querySelectorAll('.priority-btn').forEach(b => b.classList.toggle('selected', b.dataset.p === p));
}

function selCat(c) {
  selCategory = c;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('selected', b.dataset.c === c));
}

function updateModalDate() {
  document.getElementById('modalDateLabel').textContent = formatDateLabel(selectedDate);
}

function openModal() {
  if (!editId) {
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskNote').value = '';
    document.getElementById('taskStart').value = '';
    document.getElementById('taskEnd').value = '';
    selPriority('medium');
    selCat('work');
    document.getElementById('modalTitle').textContent = 'New Task';
    document.getElementById('submitBtn').textContent = 'Add Task';
  }
  updateModalDate();
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('taskTitle').focus(), 400);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editId = null;
}

function overlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

function submitTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) {
    document.getElementById('taskTitle').focus();
    document.getElementById('taskTitle').style.borderColor = 'rgba(255,95,95,0.6)';
    setTimeout(() => document.getElementById('taskTitle').style.borderColor = '', 1500);
    return;
  }

  if (!tasks[selectedDate]) tasks[selectedDate] = [];

  if (editId) {
    const t = tasks[selectedDate].find(x => x.id === editId);
    if (t) {
      t.title = title;
      t.note = document.getElementById('taskNote').value.trim();
      t.priority = selPri;
      t.category = selCategory;
      t.startTime = document.getElementById('taskStart').value;
      t.endTime = document.getElementById('taskEnd').value;
    }
    showToast('✏️ Task updated');
  } else {
    tasks[selectedDate].push({
      id: genId(),
      title,
      note: document.getElementById('taskNote').value.trim(),
      priority: selPri,
      category: selCategory,
      startTime: document.getElementById('taskStart').value,
      endTime: document.getElementById('taskEnd').value,
      done: false,
      created: Date.now()
    });
    showToast('🎉 Task added!');
  }

  save();
  closeModal();
  renderAll();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (document.getElementById('overlay').classList.contains('open')) submitTask();
  }
});

renderAll();
</script>
</body>
</html>
