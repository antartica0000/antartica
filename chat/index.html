
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local P2P WebRTC Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 80px; }
    #chat { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h2>Local P2P Browser Chat</h2>
  
  <div id="step1">
    <button onclick="createOffer()">1. Start New Chat (Host)</button>
    <p>Or paste offer SDP from Host below:</p>
    <textarea id="remoteOffer" placeholder="Paste SDP offer here..."></textarea>
    <button onclick="acceptOffer()">2. Join Chat (Peer)</button>
  </div>

  <div id="sdpOutputSection" style="display:none;">
    <p><strong>Copy this SDP payload and send it to your peer:</strong></p>
    <textarea id="localSdp" readonly></textarea>
    <button onclick="completeAnswer()" id="finishBtn" style="display:none;">3. Finalize Connection (Host)</button>
  </div>

  <hr>

  <div id="chatSection">
    <div id="chat"></div>
    <input type="text" id="msgInput" placeholder="Type a message..." disabled>
    <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
  </div>

  <script>
    let pc = new RTCPeerConnection({ iceServers: [] }); // Empty array forces LAN connection only
    let dataChannel;

    pc.onicecandidate = e => {
      if (!e.candidate) {
        document.getElementById('localSdp').value = JSON.stringify(pc.localDescription);
        document.getElementById('sdpOutputSection').style.display = 'block';
      }
    };

    function setupDataChannel(channel) {
      dataChannel = channel;
      dataChannel.onopen = () => {
        appendChat("System", "Connected directly over LAN!");
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
      };
      dataChannel.onmessage = e => appendChat("Peer", e.data);
    }

    async function createOffer() {
      dataChannel = pc.createDataChannel("chat");
      setupDataChannel(dataChannel);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
    }

    async function acceptOffer() {
      pc.ondatachannel = e => setupDataChannel(e.channel);
      const offer = JSON.parse(document.getElementById('remoteOffer').value);
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      document.getElementById('finishBtn').style.display = 'inline';
    }

    async function completeAnswer() {
      const answer = JSON.parse(document.getElementById('remoteOffer').value);
      await pc.setRemoteDescription(answer);
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      dataChannel.send(input.value);
      appendChat("You", input.value);
      input.value = "";
    }

    function appendChat(sender, msg) {
      const chat = document.getElementById('chat');
      chat.innerHTML += `<p><strong>${sender}:</strong> ${msg}</p>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
